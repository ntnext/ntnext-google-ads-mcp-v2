services:
  - type: web
    name: ntnext-google-ads-mcp-v2
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run main.py --groups core,reporting
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MCP_TRANSPORT
        value: http
      - key: MCP_READ_ONLY
        value: "true"
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: BASE_URL
        sync: false
      - key: MCP_JWT_SIGNING_KEY
        generateValue: true
      - key: MCP_STORAGE_REDIS_URL
        fromService:
          type: keyvalue
          name: ntnext-google-ads-mcp-v2-auth
          property: connectionString

  - type: keyvalue
    name: ntnext-google-ads-mcp-v2-auth
    plan: free
    ipAllowList: []
